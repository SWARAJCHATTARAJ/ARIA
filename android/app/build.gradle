plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aria.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.aria.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation fileTree(dir: '../node_modules', include: ['android-support-v4/android-support-v4.aar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

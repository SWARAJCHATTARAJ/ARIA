name: Build Native Apps

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'app-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0)'
        required: false
        default: '2.0.0'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows .exe (Tauri)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: |
          npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://aria.swarajchattaraj.tech
          VITE_API_BASE_URL: https://aria.swarajchattaraj.tech
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build Tauri Windows App
        run: |
          npx --yes @tauri-apps/cli@^2 build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate and Stage Windows Installer
        shell: pwsh
        run: |
          $ver = if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}") {
            "${{ github.event.inputs.version }}".TrimStart("v")
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/")) {
            "${{ github.ref_name }}".TrimStart("v").TrimStart("app-v")
          } else {
            "2.0.0"
          }
          $targetName = "ARIA-v${ver}-windows-setup.exe"
          Write-Host "Target Windows installer artifact name: $targetName"

          $nsis = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.exe" | Where-Object { $_.FullName -like "*bundle*nsis*" } | Select-Object -First 1
          if ($nsis) {
            Write-Host "Found NSIS installer: $($nsis.FullName)"
            Copy-Item -Path $nsis.FullName -Destination "./$targetName" -Force
          } else {
            $raw = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.exe" | Where-Object { $_.FullName -like "*release*" -and $_.FullName -notlike "*deps*" -and $_.FullName -notlike "*build*" } | Select-Object -First 1
            if ($raw) {
              Write-Host "Found release binary: $($raw.FullName)"
              Copy-Item -Path $raw.FullName -Destination "./$targetName" -Force
            } else {
              throw "No Windows executable found in src-tauri/target"
            }
          }
          Get-Item "./$targetName"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-windows-setup-exe
          path: ARIA-v*-windows-setup.exe

      - name: Publish Windows Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.version && format('v{0}', github.event.inputs.version) || 'v2.0.0') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('ARIA {0}', github.ref_name) || (github.event.inputs.version && format('ARIA v{0}', github.event.inputs.version) || 'ARIA v2.0.0') }}
          files: ARIA-v*-windows-setup.exe
          fail_on_unmatched_files: false

      - name: Write Windows Step Summary
        if: always()
        shell: pwsh
        run: |
          $status = if ("${{ job.status }}" -eq "success") { "PASS Succeeded" } else { "FAIL Failed" }
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "v2.0.0" }
          $summary = @"
          ### Windows Native Build Summary
          | Metric | Value |
          |---|---|
          | **Status** | $status |
          | **Target** | x86_64-pc-windows-msvc |
          | **Artifact** | `ARIA-v*-windows-setup.exe` |
          | **Release Tag** | `$tag` |
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  build-android:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK Build-Tools and Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://aria.swarajchattaraj.tech
          VITE_API_BASE_URL: https://aria.swarajchattaraj.tech
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Capacitor CLI & Sync
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android
          npx cap sync android

      - name: Generate Capacitor Android Adaptive Icons
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#09090B' --iconBackgroundColorDark '#09090B' --splashBackgroundColor '#09090B' --splashBackgroundColorDark '#09090B'

      - name: Make Gradle wrapper executable and Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Stage Android APK
        run: |
          RAW_VER="${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '2.0.0') }}"
          VER="${RAW_VER#v}"
          VER="${VER#app-v}"
          OUT="ARIA-v${VER}-android.apk"
          echo "Staging APK to ./$OUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "./$OUT"
          ls -lh "./$OUT"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-android-apk
          path: ARIA-v*-android.apk

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.version && format('v{0}', github.event.inputs.version) || 'v2.0.0') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('ARIA {0}', github.ref_name) || (github.event.inputs.version && format('ARIA v{0}', github.event.inputs.version) || 'ARIA v2.0.0') }}
          files: ARIA-v*-android.apk
          fail_on_unmatched_files: false

      - name: Write Android Step Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="PASS Succeeded"
          else
            EMOJI="FAIL Failed"
          fi
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}"
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### Android Native Build Summary
          | Metric | Value |
          |---|---|
          | **Status** | $EMOJI |
          | **Target** | Android SDK 34 (Capacitor) |
          | **Artifact** | \`ARIA-v*-android.apk\` |
          | **Release Tag** | \`$TAG\` |
          EOF

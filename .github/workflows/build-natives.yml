name: Build Native Apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-exe:
    name: Build Windows .exe (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust toolchain (Windows MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "x86_64-pc-windows-msvc"

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> Cargo.toml

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Build frontend (Vite production bundle)
        run: npm --prefix frontend run build

      - name: Build Tauri desktop app (Windows)
        uses: tauri-apps/tauri-action@v2
        with:
          args: "--target x86_64-pc-windows-msvc"

      - name: Upload Windows .exe installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-windows-x64-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android-apk:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Build frontend (Vite production bundle)
        run: npm --prefix frontend run build

      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/cli

      - name: Capacitor sync Android platform
        run: npx --yes @capacitor/cli sync android

      - name: Make gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

[package]
name = "aria"
version = "1.0.0"
description = "Autonomous Research & Intelligence Synthesis Engine"
authors = ["Swaraj Chhataraj"]
edition = "2021"

[[bin]]
name = "aria"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }

[profile.release]
codegen-units = 1
lto = true
